<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoRecon AI : Sign In / Create Account</title>
    <!-- Theme Initializer (Prevents FOUC) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('autorecon_theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..400,0..1,-50..200" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: "var(--rzp-bg)",
                        surface: "var(--rzp-surface-card)",
                        primary: "var(--rzp-blue)"
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css?v=20260924_5.0">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 bg-background text-zinc-900 dark:text-zinc-100 font-sans selection:bg-[#0066FF] selection:text-white">

    <!-- Top Right Theme Switcher -->
    <div class="fixed top-4 right-4 z-50">
        <button id="btnThemeToggle" onclick="toggleTheme()" aria-label="Toggle Theme" class="btn btn-ghost px-2.5 text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100">
            <span class="material-symbols-outlined text-[18px]" id="themeToggleIcon">light_mode</span>
        </button>
    </div>

    <!-- MAIN AUTH CONTAINER -->
    <div class="w-full max-w-md card p-8 sm:p-10 shadow-lg relative z-10 my-8">
        
        <!-- Logo & Title -->
        <div class="text-center mb-6">
            <a href="/" class="inline-flex items-center justify-center h-12 w-12 rounded-xl bg-[#0066FF] dark:bg-[#3B82F6] text-white shadow-sm mb-3">
                <span class="material-symbols-outlined text-2xl">bolt</span>
            </a>
            <h1 class="text-2xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100">
                AutoRecon<span class="text-[#0066FF] dark:text-[#3B82F6]">.AI</span>
            </h1>
            <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1" id="authSubtitle">
                Razorpay Multi-Tasking Accounting &amp; Financial Controller
            </p>
        </div>

        <!-- Mode Tabs -->
        <div class="flex p-1 bg-black/[0.04] dark:bg-white/[0.06] rounded-[8px] mb-5">
            <button id="tabBtnSignIn" onclick="switchAuthTab('signin')" class="flex-1 py-2 rounded-[6px] text-xs font-medium transition-all bg-[#0066FF] dark:bg-[#3B82F6] text-white shadow-xs">
                Sign In
            </button>
            <button id="tabBtnSignUp" onclick="switchAuthTab('signup')" class="flex-1 py-2 rounded-[6px] text-xs font-medium transition-all text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100">
                Create Workspace
            </button>
        </div>

        <!-- Alert Notification Box -->
        <div id="authAlert" class="hidden mb-4 p-3 rounded-[8px] text-xs flex items-center space-x-2 transition font-medium border">
            <span id="authAlertIcon" class="material-symbols-outlined text-[18px] flex-shrink-0"></span>
            <span id="authAlertText"></span>
        </div>

        <!-- SIGN IN FORM -->
        <form id="signInForm" onsubmit="handleSignIn(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1">Business Email</label>
                <div class="relative">
                    <span class="material-symbols-outlined text-zinc-400 absolute left-3 top-2.5 text-[18px]">mail</span>
                    <input type="email" id="signInEmail" required placeholder="founder@merchant.com" class="w-full pl-9 input text-xs">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="text-xs font-medium text-zinc-700 dark:text-zinc-300">Password</label>
                    <a href="javascript:void(0)" onclick="handleQuickDemoLogin()" class="text-xs font-medium text-[#0066FF] dark:text-[#3B82F6] hover:underline">
                        Demo Credentials
                    </a>
                </div>
                <div class="relative">
                    <span class="material-symbols-outlined text-zinc-400 absolute left-3 top-2.5 text-[18px]">lock</span>
                    <input type="password" id="signInPassword" required placeholder="••••••••" class="w-full pl-9 input text-xs">
                </div>
            </div>

            <button type="submit" id="btnSignInSubmit" class="w-full btn btn-primary text-xs h-10 mt-2">
                <span>Sign In to Financial OS</span>
                <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
            </button>
        </form>

        <!-- SIGN UP FORM -->
        <form id="signUpForm" onsubmit="handleSignUp(event)" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1">Your Full Name</label>
                <div class="relative">
                    <span class="material-symbols-outlined text-zinc-400 absolute left-3 top-2.5 text-[18px]">person</span>
                    <input type="text" id="signUpName" required placeholder="Divyansh Thakur" class="w-full pl-9 input text-xs">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1">Company / Store Name</label>
                <div class="relative">
                    <span class="material-symbols-outlined text-zinc-400 absolute left-3 top-2.5 text-[18px]">store</span>
                    <input type="text" id="signUpCompany" required placeholder="Zenith Retail India Pvt Ltd" class="w-full pl-9 input text-xs">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1">Business Email</label>
                <div class="relative">
                    <span class="material-symbols-outlined text-zinc-400 absolute left-3 top-2.5 text-[18px]">mail</span>
                    <input type="email" id="signUpEmail" required placeholder="divyansh@zenithretail.in" class="w-full pl-9 input text-xs">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1">Merchant GSTIN (Optional)</label>
                <div class="relative">
                    <span class="material-symbols-outlined text-zinc-400 absolute left-3 top-2.5 text-[18px]">receipt</span>
                    <input type="text" id="signUpGstin" placeholder="27AAACZ1234F1Z5" class="w-full pl-9 input text-xs font-mono">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1">Create Secure Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined text-zinc-400 absolute left-3 top-2.5 text-[18px]">lock</span>
                    <input type="password" id="signUpPassword" required minlength="6" placeholder="At least 6 characters" class="w-full pl-9 input text-xs">
                </div>
            </div>

            <button type="submit" id="btnSignUpSubmit" class="w-full btn btn-primary text-xs h-10 mt-2">
                <span>Create Workspace</span>
                <span class="material-symbols-outlined text-[16px]">sparkles</span>
            </button>
        </form>

        <!-- Quick Demo Switcher -->
        <div class="mt-6 pt-4 border-t border-black/[0.08] dark:border-white/[0.08] text-center">
            <button onclick="handleQuickDemoLogin()" class="btn btn-secondary w-full text-xs">
                <span class="material-symbols-outlined text-amber-500 text-[16px]">bolt</span>
                <span>One-Click Instant Demo Login</span>
            </button>
        </div>

    </div>

    <!-- SCRIPTS -->
    <script>
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('autorecon_theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('themeToggleIcon');
            if (!icon) return;
            const isDark = document.documentElement.classList.contains('dark');
            icon.textContent = isDark ? 'light_mode' : 'dark_mode';
        }

        function switchAuthTab(tab) {
            const btnIn = document.getElementById('tabBtnSignIn');
            const btnUp = document.getElementById('tabBtnSignUp');
            const formIn = document.getElementById('signInForm');
            const formUp = document.getElementById('signUpForm');

            if (tab === 'signin') {
                btnIn.className = 'flex-1 py-2 rounded-[6px] text-xs font-medium transition-all bg-[#0066FF] dark:bg-[#3B82F6] text-white shadow-xs';
                btnUp.className = 'flex-1 py-2 rounded-[6px] text-xs font-medium transition-all text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100';
                formIn.classList.remove('hidden');
                formUp.classList.add('hidden');
            } else {
                btnUp.className = 'flex-1 py-2 rounded-[6px] text-xs font-medium transition-all bg-[#0066FF] dark:bg-[#3B82F6] text-white shadow-xs';
                btnIn.className = 'flex-1 py-2 rounded-[6px] text-xs font-medium transition-all text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100';
                formUp.classList.remove('hidden');
                formIn.classList.add('hidden');
            }
        }

        function showAlert(msg, isSuccess = false) {
            const alert = document.getElementById('authAlert');
            const icon = document.getElementById('authAlertIcon');
            const text = document.getElementById('authAlertText');
            if (!alert || !icon || !text) return;

            text.textContent = msg;
            alert.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200');

            if (isSuccess) {
                alert.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-200', 'dark:bg-emerald-950/40', 'dark:text-emerald-400');
                icon.textContent = 'check_circle';
            } else {
                alert.classList.add('bg-red-50', 'text-red-700', 'border-red-200', 'dark:bg-red-950/40', 'dark:text-red-400');
                icon.textContent = 'warning';
            }
        }

        function handleQuickDemoLogin() {
            localStorage.setItem('autorecon_auth_token', 'demo_jwt_token_2026');
            localStorage.setItem('autorecon_current_user', JSON.stringify({
                name: 'D2C Merchant FinOps',
                email: 'demo@zenithretail.in',
                company: 'Zenith Retail India Pvt Ltd',
                gstin: '27AAACR1234F1Z5'
            }));
            showAlert('Demo credentials validated! Redirecting...', true);
            setTimeout(() => window.location.replace('/'), 800);
        }

        function handleSignIn(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSignInSubmit');
            btn.innerHTML = '<span>Signing in...</span>';

            const email = document.getElementById('signInEmail').value;
            localStorage.setItem('autorecon_auth_token', 'user_jwt_' + Date.now());
            localStorage.setItem('autorecon_current_user', JSON.stringify({
                name: email.split('@')[0],
                email: email,
                company: 'Merchant Store',
                gstin: '27AAACR1234F1Z5'
            }));

            showAlert('Authentication successful!', true);
            setTimeout(() => window.location.replace('/'), 800);
        }

        function handleSignUp(e) {
            e.preventDefault();
            const name = document.getElementById('signUpName').value;
            const company = document.getElementById('signUpCompany').value;
            const email = document.getElementById('signUpEmail').value;
            const gstin = document.getElementById('signUpGstin').value || '27AAACR1234F1Z5';

            localStorage.setItem('autorecon_auth_token', 'user_jwt_' + Date.now());
            localStorage.setItem('autorecon_current_user', JSON.stringify({
                name: name,
                email: email,
                company: company,
                gstin: gstin
            }));

            showAlert('Workspace created successfully!', true);
            setTimeout(() => window.location.replace('/'), 800);
        }
    </script>
</body>
</html>
