<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoRecon AI — Sign In / Create Account</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rzp: {
                            navy: '#02042B',
                            dark: '#0B132B',
                            card: '#0D1B3E',
                            blue: '#0066FF',
                            azure: '#3395FF',
                            cyan: '#38BDF8'
                        },
                        pine: { 800: '#0F1E3D', 900: '#08122D', 950: '#02042B' },
                        sand: { 100: '#FFFFFF', 200: '#CBD5E1', 300: '#38BDF8', 400: '#0066FF' },
                        jade: { 400: '#34D399', 500: '#10B981', 600: '#059669' },
                        terracotta: { 400: '#F87171', 500: '#EF4444', 600: '#DC2626' }
                    }
                }
            }
        }
    </script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        #liveBgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            pointer-events: none;
        }

        .auth-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.08) 0%, rgba(13, 27, 60, 0.75) 45%, rgba(6, 15, 38, 0.92) 100%);
            backdrop-filter: blur(40px) saturate(210%);
            -webkit-backdrop-filter: blur(40px) saturate(210%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 28px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.75), 0 0 40px rgba(0, 102, 255, 0.2), inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.35);
        }

        .glass-input {
            background: rgba(6, 14, 38, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            color: #FFFFFF;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: all 0.2s ease;
        }

        .glass-input:focus {
            background: rgba(8, 18, 48, 0.95);
            border-color: #3395FF;
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.35), inset 0 2px 5px rgba(0, 0, 0, 0.5);
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[#02042B] text-white selection:bg-blue-600 selection:text-white">

    <!-- LIVE BACKGROUND -->
    <canvas id="liveBgCanvas"></canvas>
    <div class="ambient-glow-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- MAIN AUTH CONTAINER -->
    <div class="w-full max-w-md auth-card p-8 sm:p-10 relative z-10 my-8">
        
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center justify-center h-14 w-14 rounded-2xl bg-gradient-to-tr from-blue-600 via-sky-500 to-emerald-400 p-[1px] shadow-xl shadow-blue-500/25 mb-4 hover:scale-105 transition active:scale-95">
                <div class="w-full h-full bg-[#08122D]/95 rounded-[15px] flex items-center justify-center backdrop-blur-md">
                    <i class="ph-fill ph-credit-card text-sky-400 text-3xl"></i>
                </div>
            </a>
            <h1 class="text-2xl font-black text-white tracking-tight">
                AutoRecon<span class="text-sky-400">.AI</span>
            </h1>
            <p class="text-xs text-slate-300 mt-1" id="authSubtitle">
                Razorpay Multi-Tasking Accounting & Autonomous Financial Controller
            </p>
        </div>

        <!-- Segmented Tab Switcher: Sign In vs Sign Up -->
        <div class="bg-[#060E28] p-1.5 rounded-2xl border border-white/10 flex items-center mb-6 shadow-inner">
            <button id="tabBtnSignIn" onclick="switchAuthTab('signin')" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition-all bg-gradient-to-r from-blue-600 to-sky-500 text-white shadow-md">
                Sign In
            </button>
            <button id="tabBtnSignUp" onclick="switchAuthTab('signup')" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-slate-300 hover:text-white">
                Create Account
            </button>
        </div>

        <!-- Alert Notification Box -->
        <div id="authAlert" class="hidden mb-5 p-3.5 rounded-xl text-xs flex items-center space-x-2.5">
            <i id="authAlertIcon" class="ph-bold ph-warning text-base flex-shrink-0"></i>
            <span id="authAlertText" class="font-medium leading-relaxed"></span>
        </div>

        <!-- SIGN IN FORM -->
        <form id="signInForm" onsubmit="handleSignIn(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-200 mb-1.5">Business Email</label>
                <div class="relative">
                    <input type="email" id="signInEmail" required placeholder="founder@company.com" class="glass-input w-full px-4 py-3 text-xs pl-10">
                    <i class="ph-bold ph-envelope-simple absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-bold text-slate-200">Password</label>
                    <a href="javascript:void(0)" onclick="alert('For demo accounts, you can sign in directly or register a new free account!')" class="text-[11px] text-sky-400 hover:underline">Forgot password?</a>
                </div>
                <div class="relative">
                    <input type="password" id="signInPassword" required placeholder="••••••••••••" class="glass-input w-full px-4 py-3 text-xs pl-10">
                    <i class="ph-bold ph-lock-key absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                </div>
            </div>

            <button type="submit" id="btnSignInSubmit" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-blue-600 via-sky-500 to-emerald-400 hover:from-blue-500 hover:to-emerald-300 text-white font-black text-xs shadow-lg shadow-blue-600/30 active:scale-95 transition flex items-center justify-center space-x-2 mt-2">
                <span>Sign In to Financial Workspace</span>
                <i class="ph-bold ph-arrow-right"></i>
            </button>
        </form>

        <!-- SIGN UP FORM (Hidden by default) -->
        <form id="signUpForm" onsubmit="handleSignUp(event)" class="hidden space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-200 mb-1.5">Your Full Name</label>
                <div class="relative">
                    <input type="text" id="signUpName" required placeholder="Divyansh Thakur" class="glass-input w-full px-4 py-3 text-xs pl-10">
                    <i class="ph-bold ph-user absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-200 mb-1.5">Company / Business Name</label>
                <div class="relative">
                    <input type="text" id="signUpCompany" required placeholder="Zenith Retail India Pvt Ltd" class="glass-input w-full px-4 py-3 text-xs pl-10">
                    <i class="ph-bold ph-buildings absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-200 mb-1.5">Work Email</label>
                    <div class="relative">
                        <input type="email" id="signUpEmail" required placeholder="divyansh@zenith.in" class="glass-input w-full px-4 py-3 text-xs pl-10">
                        <i class="ph-bold ph-envelope-simple absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-200 mb-1.5">GSTIN (Optional)</label>
                    <div class="relative">
                        <input type="text" id="signUpGstin" placeholder="27AAACZ8892Z1Z4" class="glass-input w-full px-4 py-3 text-xs pl-10 uppercase font-mono">
                        <i class="ph-bold ph-receipt absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-200 mb-1.5">Create Secure Password</label>
                <div class="relative">
                    <input type="password" id="signUpPassword" required minlength="6" placeholder="At least 6 characters" class="glass-input w-full px-4 py-3 text-xs pl-10">
                    <i class="ph-bold ph-lock-key absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                </div>
            </div>

            <button type="submit" id="btnSignUpSubmit" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-500 via-sky-500 to-blue-600 hover:from-emerald-400 hover:to-blue-500 text-white font-black text-xs shadow-lg shadow-blue-600/30 active:scale-95 transition flex items-center justify-center space-x-2 mt-2">
                <span>Create Free Workspace & Private Storage</span>
                <i class="ph-bold ph-sparkle"></i>
            </button>
        </form>

        <!-- Quick Guest Demo Entry -->
        <div class="mt-6 pt-5 border-t border-white/10 text-center">
            <button onclick="handleQuickDemoLogin()" class="text-xs text-sky-400 hover:text-white font-semibold flex items-center justify-center space-x-1.5 mx-auto transition">
                <i class="ph-bold ph-lightning text-sm"></i>
                <span>Continue as Guest Demo Merchant ➔</span>
            </button>
        </div>
    </div>

    <!-- Background Particle Script -->
    <script>
        function initLiveBackground() {
            const canvas = document.getElementById('liveBgCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const particles = [];
            const numParticles = Math.min(Math.floor(window.innerWidth / 25), 40);

            for (let i = 0; i < numParticles; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2 + 1,
                    color: (i % 3 === 0) ? '#0066FF' : (i % 3 === 1 ? '#3395FF' : '#10B981'),
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    alpha: Math.random() * 0.4 + 0.2
                });
            }

            function animateParticles() {
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 130) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(51, 149, 255, ${0.15 * (1 - dist / 130)})`;
                            ctx.lineWidth = 0.75;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }

                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.fill();
                    ctx.globalAlpha = 1;

                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    if (p.y > height) p.y = 0;
                });

                requestAnimationFrame(animateParticles);
            }

            animateParticles();
        }

        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('authAlert');
            const alertText = document.getElementById('authAlertText');
            const alertIcon = document.getElementById('authAlertIcon');
            
            alertBox.classList.remove('hidden');
            alertText.textContent = msg;

            if (isSuccess) {
                alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs flex items-center space-x-2.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40';
                alertIcon.className = 'ph-bold ph-check-circle text-base flex-shrink-0 text-emerald-400';
            } else {
                alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs flex items-center space-x-2.5 bg-red-500/20 text-red-300 border border-red-500/40';
                alertIcon.className = 'ph-bold ph-warning text-base flex-shrink-0 text-red-400';
            }
        }

        function switchAuthTab(mode) {
            const btnSignIn = document.getElementById('tabBtnSignIn');
            const btnSignUp = document.getElementById('tabBtnSignUp');
            const formSignIn = document.getElementById('signInForm');
            const formSignUp = document.getElementById('signUpForm');
            const subtitle = document.getElementById('authSubtitle');
            const alertBox = document.getElementById('authAlert');
            alertBox.classList.add('hidden');

            if (mode === 'signin') {
                btnSignIn.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition-all bg-gradient-to-r from-blue-600 to-sky-500 text-white shadow-md';
                btnSignUp.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-slate-300 hover:text-white';
                formSignIn.classList.remove('hidden');
                formSignUp.classList.add('hidden');
                subtitle.textContent = 'Razorpay Multi-Tasking Accounting & Autonomous Financial Controller';
            } else {
                btnSignUp.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition-all bg-gradient-to-r from-blue-600 to-sky-500 text-white shadow-md';
                btnSignIn.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-slate-300 hover:text-white';
                formSignIn.classList.add('hidden');
                formSignUp.classList.remove('hidden');
                subtitle.textContent = 'Create a secure workspace with dedicated partitioned database storage';
            }
        }

        async function handleSignIn(e) {
            e.preventDefault();
            const email = document.getElementById('signInEmail').value;
            const password = document.getElementById('signInPassword').value;
            const btn = document.getElementById('btnSignInSubmit');

            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin mr-2">⚙️</span> Authenticating...`;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Authentication failed');

                localStorage.setItem('autorecon_auth_token', data.token);
                localStorage.setItem('autorecon_current_user', JSON.stringify(data.user));
                showAlert('Login successful! Initializing workspace...', true);
                setTimeout(() => { window.location.href = '/'; }, 600);
            } catch (err) {
                showAlert(err.message, false);
                btn.disabled = false;
                btn.innerHTML = `<span>Sign In to Financial Workspace</span><i class="ph-bold ph-arrow-right"></i>`;
            }
        }

        async function handleSignUp(e) {
            e.preventDefault();
            const name = document.getElementById('signUpName').value;
            const companyName = document.getElementById('signUpCompany').value;
            const email = document.getElementById('signUpEmail').value;
            const gstin = document.getElementById('signUpGstin').value;
            const password = document.getElementById('signUpPassword').value;
            const btn = document.getElementById('btnSignUpSubmit');

            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin mr-2">⚙️</span> Creating Workspace...`;

            try {
                const res = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, companyName, email, gstin, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Account creation failed');

                localStorage.setItem('autorecon_auth_token', data.token);
                localStorage.setItem('autorecon_current_user', JSON.stringify(data.user));
                showAlert('Account created! Entering private workspace...', true);
                setTimeout(() => { window.location.href = '/'; }, 600);
            } catch (err) {
                showAlert(err.message, false);
                btn.disabled = false;
                btn.innerHTML = `<span>Create Free Workspace & Private Storage</span><i class="ph-bold ph-sparkle"></i>`;
            }
        }

        function handleQuickDemoLogin() {
            document.getElementById('signInEmail').value = 'demo@zenith.in';
            document.getElementById('signInPassword').value = 'zenith123';
            document.getElementById('btnSignInSubmit').click();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initLiveBackground();
        });
    </script>
</body>
</html>
