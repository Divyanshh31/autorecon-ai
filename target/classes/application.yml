server:
  port: ${PORT:8080}

spring:
  application:
    name: autorecon-ai
  datasource:
    url: jdbc:h2:mem:autorecondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

autorecon:
  sla:
    mdr-rate-percent: 2.00 # Contracted MDR fee %
    gst-rate-percent: 18.00 # GST on MDR fee %
    settlement-sla-days: 2 # T+2 business days
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_mockKeyId}
    key-secret: ${RAZORPAY_KEY_SECRET:mockSecretKey}
    mock-mode: true
  ai:
    # Server-wide shared Gemini API key (set via GEMINI_API_KEY environment variable on your host)
    gemini-api-key: ${GEMINI_API_KEY:}
    model: gemini-1.5-flash
