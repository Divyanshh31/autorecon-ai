<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoRecon AI — Sign In / Create Account</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rzp: {
                            light: '#F8FAFC',
                            subtle: '#F1F5F9',
                            card: '#FFFFFF',
                            blue: '#0066FF',
                            azure: '#0284C7',
                            cyan: '#06B6D4'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        #liveBgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            pointer-events: none;
        }

        .auth-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.95) 0%, rgba(248, 250, 252, 0.9) 100%);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 28px;
            box-shadow: 0 25px 60px -12px rgba(15, 23, 42, 0.08), inset 0 1px 1.5px 0 rgba(255, 255, 255, 1);
        }

        .glass-input {
            background: #FFFFFF;
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 14px;
            color: #0F172A;
            box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04);
            transition: all 0.2s ease;
        }

        .glass-input:focus {
            background: #FFFFFF;
            border-color: #0066FF;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[#F8FAFC] text-slate-900 selection:bg-blue-600 selection:text-white">

    <!-- LIVE BACKGROUND -->
    <canvas id="liveBgCanvas"></canvas>
    <div class="ambient-glow-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- MAIN AUTH CONTAINER -->
    <div class="w-full max-w-md auth-card p-8 sm:p-10 relative z-10 my-8">
        
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center justify-center h-14 w-14 rounded-2xl bg-gradient-to-tr from-blue-600 via-sky-500 to-emerald-400 p-[1px] shadow-xl shadow-blue-500/20 mb-4 hover:scale-105 transition active:scale-95">
                <div class="w-full h-full bg-white rounded-[15px] flex items-center justify-center backdrop-blur-md">
                    <i class="ph-fill ph-credit-card text-blue-600 text-3xl"></i>
                </div>
            </a>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">
                AutoRecon<span class="text-blue-600">.AI</span>
            </h1>
            <p class="text-xs text-slate-500 mt-1" id="authSubtitle">
                Razorpay Multi-Tasking Accounting & Autonomous Financial Controller
            </p>
        </div>

        <!-- Segmented Tab Switcher: Sign In vs Sign Up -->
        <div class="bg-slate-100 p-1.5 rounded-2xl border border-slate-200 flex items-center mb-6 shadow-inner">
            <button id="tabBtnSignIn" onclick="switchAuthTab('signin')" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition-all bg-gradient-to-r from-blue-600 to-sky-500 text-white shadow-md">
                Sign In
            </button>
            <button id="tabBtnSignUp" onclick="switchAuthTab('signup')" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-slate-600 hover:text-slate-900">
                Create Account
            </button>
        </div>

        <!-- Alert Notification Box -->
        <div id="authAlert" class="hidden mb-5 p-3.5 rounded-xl text-xs flex items-center space-x-2.5">
            <i id="authAlertIcon" class="ph-bold ph-warning text-base flex-shrink-0"></i>
            <span id="authAlertText" class="font-medium leading-relaxed"></span>
        </div>

        <!-- SIGN IN FORM -->
        <form id="signInForm" onsubmit="handleSignIn(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Business Email</label>
                <div class="relative">
                    <input type="email" id="signInEmail" required placeholder="founder@company.com" class="glass-input w-full px-4 py-3 text-xs pl-10">
                    <i class="ph-bold ph-envelope-simple absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-bold text-slate-700">Password</label>
                    <a href="javascript:void(0)" onclick="alert('For demo accounts, you can sign in directly or register a new free account!')" class="text-[11px] text-blue-600 hover:underline">Forgot password?</a>
                </div>
                <div class="relative">
                    <input type="password" id="signInPassword" required placeholder="••••••••••••" class="glass-input w-full px-4 py-3 text-xs pl-10">
                    <i class="ph-bold ph-lock-key absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                </div>
            </div>

            <button type="submit" id="btnSignInSubmit" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-blue-600 via-sky-500 to-emerald-500 hover:from-blue-700 hover:to-emerald-600 text-white font-black text-xs shadow-lg shadow-blue-600/25 active:scale-95 transition flex items-center justify-center space-x-2 mt-2">
                <span>Sign In to Financial Workspace</span>
                <i class="ph-bold ph-arrow-right"></i>
            </button>
        </form>

        <!-- SIGN UP FORM -->
        <form id="signUpForm" onsubmit="handleSignUp(event)" class="hidden space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Your Full Name</label>
                <div class="relative">
                    <input type="text" id="signUpName" required placeholder="Divyansh Thakur" class="glass-input w-full px-4 py-3 text-xs pl-10">
                    <i class="ph-bold ph-user absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Company / Business Name</label>
                <div class="relative">
                    <input type="text" id="signUpCompany" required placeholder="Zenith Retail India Pvt Ltd" class="glass-input w-full px-4 py-3 text-xs pl-10">
                    <i class="ph-bold ph-buildings absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">Work Email</label>
                    <div class="relative">
                        <input type="email" id="signUpEmail" required placeholder="divyansh@zenith.in" class="glass-input w-full px-4 py-3 text-xs pl-10">
                        <i class="ph-bold ph-envelope-simple absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">GSTIN (Optional)</label>
                    <div class="relative">
                        <input type="text" id="signUpGstin" placeholder="27AAACZ8892Z1Z4" class="glass-input w-full px-4 py-3 text-xs pl-10 uppercase font-mono">
                        <i class="ph-bold ph-receipt absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Create Secure Password</label>
                <div class="relative">
                    <input type="password" id="signUpPassword" required minlength="6" placeholder="At least 6 characters" class="glass-input w-full px-4 py-3 text-xs pl-10">
                    <i class="ph-bold ph-lock-key absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                </div>
            </div>

            <button type="submit" id="btnSignUpSubmit" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-500 via-sky-500 to-blue-600 hover:from-emerald-600 hover:to-blue-700 text-white font-black text-xs shadow-lg shadow-blue-600/25 active:scale-95 transition flex items-center justify-center space-x-2 mt-2">
                <span>Create Free Workspace & Private Storage</span>
                <i class="ph-bold ph-sparkle"></i>
            </button>
        </form>

        <!-- Quick Guest Demo Entry -->
        <div class="mt-6 pt-5 border-t border-slate-200 text-center">
            <button onclick="handleQuickDemoLogin()" class="text-xs text-blue-600 hover:text-blue-800 font-semibold flex items-center justify-center space-x-1.5 mx-auto transition">
                <i class="ph-bold ph-lightning text-sm"></i>
                <span>Continue as Guest Demo Merchant ➔</span>
            </button>
        </div>
    </div>

    <!-- Background Wave Script -->
    <script>
        function initLiveBackground() {
            const canvas = document.getElementById('liveBgCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const nodes = [];
            const numNodes = 30;

            for (let i = 0; i < numNodes; i++) {
                nodes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2.5 + 1.5,
                    color: (i % 3 === 0) ? '#0066FF' : (i % 3 === 1 ? '#0284C7' : '#059669'),
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    glow: Math.random() * 8 + 4
                });
            }

            let waveStep = 0;

            function renderFintechCanvas() {
                ctx.clearRect(0, 0, width, height);

                waveStep += 0.015;
                const waves = [
                    { y: height * 0.75, amp: 40, freq: 0.002, speed: 1.0, color: 'rgba(0, 102, 255, 0.18)', lineWidth: 2 },
                    { y: height * 0.82, amp: 30, freq: 0.0025, speed: -0.8, color: 'rgba(2, 132, 199, 0.15)', lineWidth: 1.5 }
                ];

                waves.forEach(w => {
                    ctx.beginPath();
                    ctx.strokeStyle = w.color;
                    ctx.lineWidth = w.lineWidth;
                    for (let x = 0; x <= width; x += 10) {
                        const y = w.y + Math.sin(x * w.freq + waveStep * w.speed) * w.amp;
                        if (x === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                });

                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        const dx = nodes[i].x - nodes[j].x;
                        const dy = nodes[i].y - nodes[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 140) {
                            ctx.beginPath();
                            const alpha = (1 - dist / 140) * 0.25;
                            ctx.strokeStyle = `rgba(0, 102, 255, ${alpha})`;
                            ctx.lineWidth = 0.8;
                            ctx.moveTo(nodes[i].x, nodes[i].y);
                            ctx.lineTo(nodes[j].x, nodes[j].y);
                            ctx.stroke();
                        }
                    }
                }

                nodes.forEach(n => {
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                    ctx.fillStyle = n.color;
                    ctx.fill();

                    n.x += n.vx;
                    n.y += n.vy;

                    if (n.x < 0 || n.x > width) n.vx *= -1;
                    if (n.y < 0 || n.y > height) n.vy *= -1;
                });

                requestAnimationFrame(renderFintechCanvas);
            }

            renderFintechCanvas();
        }

        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('authAlert');
            const alertText = document.getElementById('authAlertText');
            const alertIcon = document.getElementById('authAlertIcon');
            
            alertBox.classList.remove('hidden');
            alertText.textContent = msg;

            if (isSuccess) {
                alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs flex items-center space-x-2.5 bg-emerald-50 text-emerald-800 border border-emerald-200';
                alertIcon.className = 'ph-bold ph-check-circle text-base flex-shrink-0 text-emerald-600';
            } else {
                alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs flex items-center space-x-2.5 bg-red-50 text-red-800 border border-red-200';
                alertIcon.className = 'ph-bold ph-warning text-base flex-shrink-0 text-red-600';
            }
        }

        function switchAuthTab(mode) {
            const btnSignIn = document.getElementById('tabBtnSignIn');
            const btnSignUp = document.getElementById('tabBtnSignUp');
            const formSignIn = document.getElementById('signInForm');
            const formSignUp = document.getElementById('signUpForm');
            const subtitle = document.getElementById('authSubtitle');
            const alertBox = document.getElementById('authAlert');
            alertBox.classList.add('hidden');

            if (mode === 'signin') {
                btnSignIn.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition-all bg-gradient-to-r from-blue-600 to-sky-500 text-white shadow-md';
                btnSignUp.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-slate-600 hover:text-slate-900';
                formSignIn.classList.remove('hidden');
                formSignUp.classList.add('hidden');
                subtitle.textContent = 'Razorpay Multi-Tasking Accounting & Autonomous Financial Controller';
            } else {
                btnSignUp.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition-all bg-gradient-to-r from-blue-600 to-sky-500 text-white shadow-md';
                btnSignIn.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-slate-600 hover:text-slate-900';
                formSignIn.classList.add('hidden');
                formSignUp.classList.remove('hidden');
                subtitle.textContent = 'Create a secure workspace with dedicated partitioned database storage';
            }
        }

        async function handleSignIn(e) {
            e.preventDefault();
            const email = document.getElementById('signInEmail').value;
            const password = document.getElementById('signInPassword').value;
            const btn = document.getElementById('btnSignInSubmit');

            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin mr-2">⚙️</span> Authenticating...`;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Authentication failed');

                localStorage.setItem('autorecon_auth_token', data.token);
                localStorage.setItem('autorecon_current_user', JSON.stringify(data.user));
                showAlert('Login successful! Initializing workspace...', true);
                setTimeout(() => { window.location.href = '/'; }, 600);
            } catch (err) {
                showAlert(err.message, false);
                btn.disabled = false;
                btn.innerHTML = `<span>Sign In to Financial Workspace</span><i class="ph-bold ph-arrow-right"></i>`;
            }
        }

        async function handleSignUp(e) {
            e.preventDefault();
            const name = document.getElementById('signUpName').value;
            const companyName = document.getElementById('signUpCompany').value;
            const email = document.getElementById('signUpEmail').value;
            const gstin = document.getElementById('signUpGstin').value;
            const password = document.getElementById('signUpPassword').value;
            const btn = document.getElementById('btnSignUpSubmit');

            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin mr-2">⚙️</span> Creating Workspace...`;

            try {
                const res = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, companyName, email, gstin, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Account creation failed');

                localStorage.setItem('autorecon_auth_token', data.token);
                localStorage.setItem('autorecon_current_user', JSON.stringify(data.user));
                showAlert('Account created! Entering private workspace...', true);
                setTimeout(() => { window.location.href = '/'; }, 600);
            } catch (err) {
                showAlert(err.message, false);
                btn.disabled = false;
                btn.innerHTML = `<span>Create Free Workspace & Private Storage</span><i class="ph-bold ph-sparkle"></i>`;
            }
        }

        function handleQuickDemoLogin() {
            document.getElementById('signInEmail').value = 'demo@zenith.in';
            document.getElementById('signInPassword').value = 'zenith123';
            document.getElementById('btnSignInSubmit').click();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initLiveBackground();
        });
    </script>
</body>
</html>
